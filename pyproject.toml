[project]
name = "drone-detector"
version = "0.1.0"
description = "Détection de drones FPV avec IA (YOLO)"
authors = [
    {name = "rgeral"},
    {name = "falonso"},
    {name = "tdutel"},
    {name = "anfichet"}
]
requires-python = ">=3.8"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.7",
    "pillow>=10.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "ultralytics>=8.0.0",
    "pycocotools>=2.0.6",
    "albumentations>=1.3.0",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "black==24.3.0",
    "isort==5.13.0",
    "flake8==7.0.0",
    "pytest==8.1.0",
    "pre-commit==3.6.0",
    "jupyter>=1.0",
    "ipython>=8.12",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# Configuration Black (formatter)
[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

# Configuration isort (tri des imports)
[tool.isort]
profile = "black"
line_length = 100

# Configuration pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
